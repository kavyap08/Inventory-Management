<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    .glass {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(18px);
    }

    .table-row {
      transition: all 0.25s ease;
    }

    .table-row:hover {
      background: #eef2ff;
      transform: scale(1.005);
    }

    .input-box {
      transition: all 0.25s ease;
    }

    .input-box:focus {
      transform: translateY(-2px);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
    }

  </style>
</head>

<body>

<div th:replace="layout :: appLayout(~{::section})">

  <section>

    <div class="glass rounded-3xl border border-white/60 shadow-xl overflow-hidden">

      <div class="px-8 py-6 border-b border-indigo-100">

        <div class="flex items-center justify-between gap-4 flex-wrap mb-5">

          <div>
            <h2 class="text-xl font-bold text-gray-800">
              Inventory
            </h2>

            <p class="text-sm text-gray-400 mt-1">
              Search and manage available stock
            </p>
          </div>

        </div>


        <form th:action="@{/inventory}" method="get" class="flex items-center gap-3">

          <div class="relative w-full">

            <input
              type="text"
              name="keyword"
              th:value="${keyword}"
              placeholder="Search by SKU, part name, or category..."
              class="input-box w-full pl-12 pr-5 py-4 rounded-2xl border border-gray-200 outline-none bg-white/80 text-gray-700"
            >

            <svg class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24">
              <path stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>

          </div>

          <button
            type="submit"
            class="px-6 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold shadow-lg shadow-indigo-200 hover:scale-105 transition-all"
          >
            Search
          </button>

          <a th:href="@{/inventory}"
             class="px-6 py-4 rounded-2xl bg-gray-100 text-gray-600 font-semibold hover:scale-105 transition-all">
            Reset
          </a>

        </form>

      </div>
	  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

	      <div class="glass-card rounded-2xl p-6">

	          <p class="text-gray-500 text-sm">
	              Total Parts
	          </p>

	          <h2 class="text-3xl font-bold text-indigo-600"
	              th:text="${parts.size()}">
	          </h2>

	      </div>

	      <div class="glass-card rounded-2xl p-6">

	          <p class="text-gray-500 text-sm">
	              Inventory Status
	          </p>

	          <h2 class="text-3xl font-bold text-green-600">
	              Active
	          </h2>

	      </div>

	      <div class="glass-card rounded-2xl p-6">

	          <p class="text-gray-500 text-sm">
	              Low Stock Alerts
	          </p>

	          <h2 class="text-3xl font-bold text-red-600">

	              <span th:text="${lowStockCount}">
	              </span>

	          </h2>

	      </div>

	  </div>


      <div class="overflow-x-auto">
		

        <table class="w-full">

			<thead>
			<tr class="bg-gray-100">

			    <th class="px-6 py-4 text-left">SKU</th>

			    <th class="px-6 py-4 text-left">Part Name</th>

			    <th class="px-6 py-4 text-left">Category</th>

			    <th class="px-6 py-4 text-left">Stock</th>

			    <th class="px-6 py-4 text-left">Threshold</th>

			    <th class="px-6 py-4 text-left">Status</th>
				
				<th class="px-4 py-3">Action</th>

			</tr>
			</thead>


          <tbody>

            <tr class="table-row border-t border-indigo-50"
                th:each="part : ${parts}">

				<td class="px-6 py-4"
				    th:text="${part.sku}">
				</td>

				<td class="px-6 py-4"
				    th:text="${part.partName}">
				</td>

				<td class="px-6 py-4"
				    th:text="${part.category}">
				</td>

				<td class="px-6 py-4">

				    <span
				        th:if="${part.stock <= part.threshold}"
				        class="font-bold text-red-600"
				        th:text="${part.stock}">
				    </span>

				    <span
				        th:if="${part.stock > part.threshold}"
				        class="font-bold text-green-600"
				        th:text="${part.stock}">
				    </span>

				</td>

				<td class="px-6 py-4"
				    th:text="${part.threshold}">
				</td>

				<td class="px-6 py-4">

				    <!-- Low Stock -->

				    <span
				        th:if="${part.stock <= part.threshold}"
				        class="px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-600">

				        LOW STOCK

				    </span>

				    <!-- Normal -->

				    <span
				        th:if="${part.stock > part.threshold}"
				        class="px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-600">

				        AVAILABLE

				    </span>

				</td>
				<td class="px-4 py-3">

						  			    <a th:if="${part.stock <= part.threshold}"
						  			       th:href="@{/generate-pr(sku=${part.sku})}"
						  			       class="px-4 py-2 rounded-xl bg-red-500 text-white text-sm font-semibold hover:bg-red-600">

						  			        Generate PR

						  			    </a>

						  			</td>

            </tr>


            <tr th:if="${parts == null or #lists.isEmpty(parts)}">

              <td colspan="5" class="px-8 py-12 text-center text-gray-400 font-semibold">
                No inventory parts found
              </td>
			 
			  

            </tr>
			
			

          </tbody>

        </table>

      </div>

    </div>

  </section>

</div>

</body>
</html>
