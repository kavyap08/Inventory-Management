<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Audit Trail</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>

<div th:replace="layout :: appLayout(~{::section})">

<section>

  <div class="glass rounded-3xl overflow-hidden border border-white/60 shadow-xl">

    <div class="px-8 py-5 border-b border-indigo-100">

      <div class="flex items-center justify-between">

        <div>

          <h2 class="text-2xl font-bold text-gray-800">
            Audit Trail
          </h2>

          <p class="text-sm text-gray-400 mt-1">
            Complete ticket activity history
          </p>

        </div>

      </div>

    </div>

    <div class="overflow-x-auto">

      <table class="w-full">

        <thead>

        <tr class="bg-indigo-50 text-left text-sm text-gray-500 uppercase tracking-wider">

          <th class="px-8 py-5">Audit ID</th>

          <th class="px-8 py-5">Ticket</th>

          <th class="px-8 py-5">User</th>

          <th class="px-8 py-5">Type</th>

          <th class="px-8 py-5">Comment</th>

          <th class="px-8 py-5">Date & Time</th>

        </tr>

        </thead>

        <tbody>

        <tr class="border-t border-indigo-50 hover:bg-indigo-50/40 transition-all"
            th:each="audit : ${audits}">

          <td class="px-8 py-5 font-bold text-gray-700"
              th:text="${audit.id}">
          </td>

          <td class="px-8 py-5">

            <a th:href="@{/ticket-overview(ticket_id=${audit.ticket.ticket_id})}"
               class="font-bold text-indigo-600 hover:underline"
               th:text="${audit.ticket.customTicketId}">
            </a>

          </td>

          <td class="px-8 py-5 text-gray-700 font-semibold"
              th:text="${audit.user.username}">
          </td>

          <td class="px-8 py-5">

            <span class="px-4 py-2 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-600"
                  th:text="${audit.type}">
            </span>

          </td>

          <td class="px-8 py-5 text-gray-700"
              th:text="${audit.comment}">
          </td>

          <td class="px-8 py-5 text-gray-500"
              th:text="${audit.createdAt}">
          </td>

        </tr>

        </tbody>

      </table>

    </div>

  </div>

</section>

</div>

</body>
</html>
