<!DOCTYPE html>
<html lang="en"
xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Purchase Requisition</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>

<div th:replace="layout :: appLayout(~{::section})">

<section>

<div class="glass rounded-3xl border border-white/60 shadow-xl overflow-hidden">

    <div class="px-8 py-6 border-b border-indigo-100">

        <h1 class="text-3xl font-bold text-gray-800">

            Purchase Requisition

        </h1>

        <p class="text-gray-500 mt-2">

            Manage low stock procurement requests

        </p>

    </div>

    <div class="overflow-x-auto">

        <table class="w-full">

            <thead>

            <tr class="bg-gray-100">

                <th class="px-6 py-4 text-left">
                    PR Number
                </th>

                <th class="px-6 py-4 text-left">
                    SKU
                </th>

                <th class="px-6 py-4 text-left">
                    Part Name
                </th>

                <th class="px-6 py-4 text-left">
                    Current Stock
                </th>

                <th class="px-6 py-4 text-left">
                    Requested Qty
                </th>

                <th class="px-6 py-4 text-left">
                    Status
                </th>

                <th class="px-6 py-4 text-left">
                    Created By
                </th>

                <th class="px-6 py-4 text-left">
                    Created At
                </th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="pr : ${prs}"
                class="border-t hover:bg-indigo-50">

                <td class="px-6 py-4 font-semibold text-indigo-600"
                    th:text="${pr.prNumber}">
                </td>

                <td class="px-6 py-4"
                    th:text="${pr.part.sku}">
                </td>

                <td class="px-6 py-4"
                    th:text="${pr.part.partName}">
                </td>

                <td class="px-6 py-4">

                    <span class="font-bold text-red-600"
                          th:text="${pr.currentStock}">
                    </span>

                </td>

                <td class="px-6 py-4 font-semibold"
                    th:text="${pr.requestedQty}">
                </td>

                <td class="px-6 py-4">

                    <span th:if="${pr.status == 'OPEN'}"
                          class="px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 text-xs font-bold">

                        OPEN

                    </span>

                    <span th:if="${pr.status == 'APPROVED'}"
                          class="px-3 py-1 rounded-full bg-green-100 text-green-700 text-xs font-bold">

                        APPROVED

                    </span>

                    <span th:if="${pr.status == 'REJECTED'}"
                          class="px-3 py-1 rounded-full bg-red-100 text-red-700 text-xs font-bold">

                        REJECTED

                    </span>

                    <span th:if="${pr.status == 'PO_CREATED'}"
                          class="px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold">

                        PO CREATED

                    </span>

                </td>

                <td class="px-6 py-4"
                    th:text="${pr.createdBy.username}">
                </td>

                <td class="px-6 py-4 text-sm text-gray-500"
                    th:text="${pr.createdAt}">
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(prs)}">

                <td colspan="8"
                    class="px-8 py-12 text-center text-gray-400 font-semibold">

                    No Purchase Requisitions Found

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</section>

</div>

</body>

</html>
