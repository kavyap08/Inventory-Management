<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parts Management</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    .glass {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(18px);
    }

    .table-row {
      transition: all 0.25s ease;
    }

    .table-row:hover {
      background: #eef2ff;
      transform: scale(1.01);
    }

    .modal {
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      transform: translateY(30px);
      transition: all 0.3s ease;
    }

    .modal.show .modal-card {
      transform: translateY(0);
    }

    .input-box {
      transition: all 0.25s ease;
    }

    .input-box:focus {
      transform: translateY(-2px);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
    }

  </style>
</head>

<body>

<div th:replace="layout :: appLayout(~{::section})">

  <section>

    <div class="glass rounded-3xl overflow-hidden border border-white/60 shadow-xl">

      <div class="px-8 py-5 border-b border-indigo-100 flex items-center justify-between gap-4 flex-wrap">

        <div>
          <h2 class="text-xl font-bold text-gray-800">
            Parts Management
          </h2>

          <p class="text-sm text-gray-400 mt-1">
            Manage TPM hardware parts inventory
          </p>
        </div>

        <button
          onclick="openPartModal()"
          th:if="${role == 'SUPERADMIN'}"
          class="px-6 py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold shadow-lg shadow-indigo-200 hover:scale-105 transition-all"
        >
          + Add Part
        </button>

      </div>


      <div class="overflow-x-auto">

        <table class="w-full">

          <thead>

            <tr class="bg-indigo-50 text-left text-sm text-gray-500 uppercase tracking-wider">

              <th class="px-8 py-5">SKU</th>

              <th class="px-8 py-5">Part Name</th>

              <th class="px-8 py-5">Category</th>

              <th class="px-8 py-5">Base Price</th>

              <th class="px-8 py-5">Stock</th>

            </tr>

          </thead>


          <tbody>

            <tr class="table-row border-t border-indigo-50"
                th:each="part : ${parts}">

              <td class="px-8 py-5 font-bold text-gray-800"
                  th:text="${part.sku}">
                SKU
              </td>

              <td class="px-8 py-5 text-gray-700 font-semibold"
                  th:text="${part.partName}">
                Part Name
              </td>

              <td class="px-8 py-5">

                <span class="px-4 py-2 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-600"
                      th:text="${part.category}">
                  Category
                </span>

              </td>

              <td class="px-8 py-5 text-gray-600 font-medium"
                  th:text="'₹' + ${part.basePrice}">
                ₹0
              </td>

              <td class="px-8 py-5">

                <span class="px-4 py-2 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-600"
                      th:text="${part.stock}"></span>
                  
                </span>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>


    <div
      id="partModal"
      class="modal fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-5"
    >

      <div class="modal-card glass rounded-3xl w-full max-w-2xl p-8 shadow-2xl border border-white/60">

        <div class="flex items-center justify-between mb-8">

          <div>
            <h2 class="text-2xl font-bold text-gray-800">
              Add New Part
            </h2>

            <p class="text-sm text-gray-400 mt-1">
              Create a new inventory part
            </p>
          </div>

          <button
            onclick="closePartModal()"
            class="w-10 h-10 rounded-xl bg-rose-100 text-rose-500 hover:scale-110 transition-all"
          >
            ✕
          </button>

        </div>


        <form th:action="@{/add-part}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-5">

          <div>

            <label class="block text-sm font-semibold text-gray-600 mb-2">
              SKU
            </label>

            <input
              type="text"
              name="sku"
              placeholder="Enter SKU"
              required
              class="input-box w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none bg-white/70"
            >

          </div>


          <div>

            <label class="block text-sm font-semibold text-gray-600 mb-2">
              Part Name
            </label>

            <input
              type="text"
              name="partName"
              placeholder="Enter part name"
              required
              class="input-box w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none bg-white/70"
            >

          </div>


          <div>

            <label class="block text-sm font-semibold text-gray-600 mb-2">
              Category
            </label>

            <select
              name="category"
              required
              class="input-box w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none bg-white/70"
            >

              <option value="">Select Category</option>

              <option value="MotherBoard">
                MotherBoard
              </option>

              <option value="CPU">
                CPU
              </option>

              <option value="Network">
                Network
              </option>

              <option value="RAM">
                RAM
              </option>

              <option value="Storage">
                Storage
              </option>

            </select>

          </div>


          <div>

            <label class="block text-sm font-semibold text-gray-600 mb-2">
              Base Price
            </label>

            <input
              type="number"
              name="basePrice"
              placeholder="Enter base price"
              min="0"
              step="0.01"
              required
              class="input-box w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none bg-white/70"
            >

          </div>


          <div class="md:col-span-2">

            <label class="block text-sm font-semibold text-gray-600 mb-2">
              Stock
            </label>

            <input
              type="number"
              name="stock"
              placeholder="Enter stock quantity"
              min="0"
              required
              class="input-box w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none bg-white/70"
            >

          </div>
		  
		  <div>

		      <label class="block text-sm font-semibold text-gray-600 mb-2">
		          Threshold
		      </label>

		      <input
		          type="number"
		          name="threshold"
		          min="0"
		          placeholder="Enter threshold quantity"
		          required
		          class="input-box w-full px-5 py-4 rounded-2xl border border-gray-200 outline-none bg-white/70"
		      >

		  </div>


          <div class="md:col-span-2 pt-4">

            <button
              type="submit"
              class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold shadow-lg shadow-indigo-200 hover:scale-[1.02] transition-all"
            >
              Save Part
            </button>

          </div>

        </form>

      </div>

    </div>


    <script>

      const partModal = document.getElementById("partModal");

      function openPartModal() {
        partModal.classList.add("show");
      }

      function closePartModal() {
        partModal.classList.remove("show");
      }

      window.addEventListener("click", function(e) {

        if(e.target === partModal) {
          closePartModal();
        }

      });

    </script>

  </section>

</div>

</body>
</html>
